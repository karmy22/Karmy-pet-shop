<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karmy Pet Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #F9F7EF;
            color: #2C3E4E;
        }
        
        nav {
            background-color: #4A7C8A;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        
        nav h1 {
            font-size: 24px;
        }
        
        .cart-btn {
            background-color: #E89B5F;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .cart-btn:hover {
            background-color: #F4C291;
        }
        
        .hero {
            background: linear-gradient(135deg, #4A7C8A 0%, #E89B5F 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        
        .hero h2 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .product-card {
            background: white;
            border: 2px solid #4A7C8A;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .product-card h3 {
            color: #4A7C8A;
            margin-bottom: 10px;
        }
        
        .product-card .price {
            font-size: 24px;
            color: #E89B5F;
            font-weight: bold;
            margin: 15px 0;
        }
        
        .add-btn {
            background-color: #E89B5F;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        
        .add-btn:hover {
            background-color: #4A7C8A;
        }
        
        footer {
            background-color: #4A7C8A;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>🐾 KARMY PET SHOP</h1>
        <button class="cart-btn">🛒 Cart (0)</button>
    </nav>
    
    <div class="hero">
        <h2>Welcome to Karmy Pet Shop</h2>
        <p>Premium Pet Supplies & Accessories</p>
    </div>
    
    <div class="products">
        <div class="product-card">
            <h3>Dog Harness - Medium</h3>
            <div style="font-size: 60px;">🐕</div>
            <p>Comfortable & durable harness</p>
            <div class="price">$59.99</div>
            <button class="add-btn">Add to Cart</button>
        </div>
        
        <div class="product-card">
            <h3>Dog Leash - 6ft</h3>
            <div style="font-size: 60px;">🪢</div>
            <p>Strong and reliable leash</p>
            <div class="price">$34.99</div>
            <button class="add-btn">Add to Cart</button>
        </div>
        
        <div class="product-card">
            <h3>LED Clip Accessory</h3>
            <div style="font-size: 60px;">💡</div>
            <p>Night visibility clip</p>
            <div class="price">$14.99</div>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 Karmy Pet Shop. All rights reserved.</p>
    </footer>
</body>
</html>
