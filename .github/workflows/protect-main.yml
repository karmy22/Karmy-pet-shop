name: Set Main Branch Rulesets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  administration: write

jobs:
  set-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Apply rulesets to main branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const rulesetName = 'main-branch-protection';

            // Check for existing rulesets
            const { data: existingRulesets } = await github.rest.repos.getRepoRulesets({
              owner,
              repo,
            });

            const existing = existingRulesets.find(r => r.name === rulesetName);

            const rulesetConfig = {
              owner,
              repo,
              name: rulesetName,
              target: 'branch',
              enforcement: 'active',
              conditions: {
                ref_name: {
                  include: ['refs/heads/main'],
                  exclude: []
                }
              },
              bypass_actors: [],
              rules: [
                {
                  type: 'pull_request',
                  parameters: {
                    dismiss_stale_reviews_on_push: true,
                    require_code_owner_review: true,
                    required_approving_review_count: 1,
                    required_review_thread_resolution: true
                  }
                },
                {
                  type: 'non_fast_forward'
                },
                {
                  type: 'deletion'
                }
              ]
            };

            if (existing) {
              await github.rest.repos.updateRepoRuleset({
                ...rulesetConfig,
                ruleset_id: existing.id,
              });
              console.log(`Ruleset '${rulesetName}' updated successfully.`);
            } else {
              await github.rest.repos.createRepoRuleset(rulesetConfig);
              console.log(`Ruleset '${rulesetName}' created successfully.`);
            }
